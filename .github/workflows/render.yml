name: Agent Music Render
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-music-render
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test deps
        run: pip install pytest

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Snapshot — discover, validate, collect
        id: snapshot
        run: |
          python -m agent_music.cli snapshot \
            --config config/federation.json \
            --output snapshot.json \
            --metadata-output snapshot-meta.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch previous render metadata
        id: prev
        continue-on-error: true
        run: |
          git fetch origin render 2>/dev/null || true
          if git show origin/render:render.json 2>/dev/null > prev_render.json; then
            echo "Fetched previous render metadata"
          else
            echo "No previous render found (first run)"
          fi

      - name: Check for federation state changes
        id: check
        run: |
          NEW_HASH=$(python -c "import json; print(json.load(open('snapshot-meta.json'))['semantic_snapshot_sha256'])")
          echo "new_hash=$NEW_HASH" >> $GITHUB_OUTPUT
          if [ -f prev_render.json ]; then
            PREV_HASH=$(python -c "import json; print(json.load(open('prev_render.json'))['semantic_snapshot_sha256'])")
            echo "prev_hash=$PREV_HASH" >> $GITHUB_OUTPUT
            if [ "$NEW_HASH" = "$PREV_HASH" ]; then
              echo "Federation state unchanged — stopping"
              echo "state_changed=false" >> $GITHUB_OUTPUT
            else
              echo "Federation state changed — will compose and render"
              echo "state_changed=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "First render — will compose and render"
            echo "state_changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Compose — snapshot to canonical Composition
        if: steps.check.outputs.state_changed == 'true'
        id: compose
        run: |
          python -m agent_music.cli compose \
            --input snapshot.json \
            --output composition.json

      - name: Render — WAV + SVG from persisted Composition
        if: steps.check.outputs.state_changed == 'true'
        id: render
        run: |
          python -m agent_music.cli render \
            --input composition.json \
            --wav-output federation.wav \
            --svg-output federation.svg \
            --metadata-output render.json

      - name: Publish to render branch
        if: steps.check.outputs.state_changed == 'true'
        run: |
          mkdir -p /tmp/render-out
          cp federation.wav federation.svg composition.json render.json /tmp/render-out/
          git checkout --orphan render-next
          git rm -rf --cached . 2>/dev/null || true
          rm -rf ./*
          cp /tmp/render-out/federation.wav /tmp/render-out/federation.svg \
             /tmp/render-out/composition.json /tmp/render-out/render.json .
          git add -f federation.wav federation.svg composition.json render.json
          git config user.name "agent-music[bot]"
          git config user.email "agent-music[bot]@users.noreply.github.com"
          HASH_SHORT=$(python -c "import json; print(json.load(open('render.json'))['semantic_snapshot_sha256'][:8])")
          git commit -m "render: update federation sound [state ${HASH_SHORT}]"
          git push origin render-next:render --force
